name: pytest-with-coverage

permissions: {}

on:
  push:
    branches: [ '*' ]
  # Enable workflow to be triggered from GitHub CLI, browser, or via API
  # primarily for testing conda env solution for new Python versions
  workflow_dispatch:

# Helps prevent parallel runs of the workflow from overlapping
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-with-coverage:
    name: Run pytest-with-coverage
    permissions:
      contents: read  # Required to access the repository's contents
      pull-requests: write  # Required to upload coverage report to to GitHub pull request

    strategy:
      fail-fast: false
      matrix:
        environment: [ 'test-py314' ]

    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false  # Required to avoid exposing secrets to pytest run in forked PRs

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          cache: true
          environments: ${{ matrix.environment }}

      - name: Run pytest-with-coverage
        # we need to specify that the coverage config is in the pyproject.toml file
        # because something in the repo (maybe cookiecutter?) causes the tests to run
        # in parallel and coverage raises and error about combining branch and statement
        # coverage data; providing the coverage config explicitly is a work-around
        run: pixi run -e ${INPUTS_ENVIRONMENT} pytest --cov=$GITHUB_WORKSPACE --cov-config=pyproject.toml --cov-report=xml
        env:
          INPUTS_ENVIRONMENT: ${{ matrix.environment }}

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}  # zizmor: ignore[secrets-outside-env]
